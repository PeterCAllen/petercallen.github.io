- title: "Genome-wide DNA methylation analysis implicates enrichment of interferon pathway in African American patients with Systemic Lupus Erythematosus and European Americans with lupus nephritis"
  authors: "Allen, P. C., Roberts, K., Rubio, J. E., Tiwari, H. K., Absher, D. M., Cooper, S. J., Myers, R. M., & Brown, E. E."
  journal: "Journal of autoimmunity"
  year: 2023
  link: "https://doi.org/10.1016/j.jaut.2023.103089"
  summary: "Systemic Lupus Erythematosus (SLE) is a chronic, multisystem, inflammatory autoimmune disease that disproportionately affects women. Trends in SLE prevalence and clinical course differ by ancestry, with those of African American ancestry presenting with more active, severe and rapidly progressive disease than European Americans. Previous research established altered epigenetic signatures in SLE patients compared to controls. However, the contribution of aberrant DNA methylation (DNAm) to the risk of SLE by ancestry and differences among patients with SLE-associated Lupus Nephritis (LN) has not been well described. We evaluated the DNA methylomes of 87 individuals including 41 SLE patients, with and without LN, and 46 controls enrolled in an ancestry diverse, well-characterized cohort study of established SLE (41 SLE patients [20 SLE-LN+, 21 SLE-LN-] and 46 sex-, race- and age-matched controls; 55% African American, 45% European American). Participants were genotyped using the Infinium Global Diversity Array (GDA), and genetic ancestry was estimated using principal components. Genome-wide DNA methylation was initially measured using the Illumina MethylationEPIC 850K Beadchip array followed by methylation-specific qPCR to validate the methylation status at putative loci. Differentially Methylated Positions (DMP) were identified using a case-control approach adjusted for ancestry. We identified a total of 51 DMPs in CpGs among SLE patients compared to controls. Genes proximal to these CpGs were highly enriched for involvement in type I interferon signaling. DMPs among European American SLE patients with LN were similar to African American SLE patients with and without LN. Our findings were validated using an orthogonal, methyl-specific PCR for three SLE-associated DMPs near or proximal to MX1, USP18, and IFITM1. Our study confirms previous reports that DMPs in CpGs associated with SLE are enriched in type I interferon genes. However, we show that European American SLE patients with LN have similar DNAm patterns to African American SLE patients irrespective of LN, suggesting that aberrant DNAm alters activity of type I interferon pathway leading to more severe disease independent of ancestry."

- title: "Distinct genome-wide DNA methylation and gene expression signatures in classical monocytes from African American patients with systemic sclerosis"
  authors: "Allen, P. C., Smith, S., Wilson, R. C., Wirth, J. R., Wilson, N. H., Baker Frost, D., Flume, J., Gilkeson, G. S., Cunningham, M. A., Langefeld, C. D., Absher, D. M., & Ramos, P. S."
  journal: "Clinical epigenetics"
  year: 2023
  link: "https://doi.org/10.1186/s13148-023-01445-5"
  summary: "Background: Systemic sclerosis (SSc) is a multisystem autoimmune disorder that has an unclear etiology and disproportionately affects women and African Americans. Despite this, African Americans are dramatically underrepresented in SSc research. Additionally, monocytes show heightened activation in SSc and in African Americans relative to European Americans. In this study, we sought to investigate DNA methylation and gene expression patterns in classical monocytes in a health disparity population.

Methods: Classical monocytes (CD14+ + CD16-) were FACS-isolated from 34 self-reported African American women. Samples from 12 SSc patients and 12 healthy controls were hybridized on MethylationEPIC BeadChip array, while RNA-seq was performed on 16 SSc patients and 18 healthy controls. Analyses were computed to identify differentially methylated CpGs (DMCs), differentially expressed genes (DEGs), and CpGs associated with changes in gene expression (eQTM analysis).

Results: We observed modest DNA methylation and gene expression differences between cases and controls. The genes harboring the top DMCs, the top DEGs, as well as the top eQTM loci were enriched for metabolic processes. Genes involved in immune processes and pathways showed a weak upregulation in the transcriptomic analysis. While many genes were newly identified, several other have been previously reported as differentially methylated or expressed in different blood cells from patients with SSc, supporting for their potential dysregulation in SSc.

Conclusions: While contrasting with results found in other blood cell types in largely European-descent groups, the results of this study support that variation in DNA methylation and gene expression exists among different cell types and individuals of different genetic, clinical, social, and environmental backgrounds. This finding supports the importance of including diverse, well-characterized patients to understand the different roles of DNA methylation and gene expression variability in the dysregulation of classical monocytes in diverse populations, which might help explaining the health disparities."
